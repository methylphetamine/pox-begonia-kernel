name: Pox Kernel Build & Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'release/**'
      - 'v*'
  workflow_dispatch:
    inputs:
      root:
        description: 'Root solution / edition'
        required: true
        default: 'onyx'
        type: choice
        options:
          - onyx
          - onyx-apatch
          - onyx-folkpatch
          - onyx-ksu-next
          - onyx-bakasu
          - onyx-kaeru
          - granite
          - obsidian
      miui:
        description: 'Add MIUI/HyperOS overlay'
        required: false
        default: false
        type: boolean
      c2:
        description: 'Add Codec2 media overlay'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release Pox Kernel
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Host Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf libelf-dev libssl-dev lz4 \
            make zip python3 python-is-python3 libncurses-dev pahole

      - name: Setup CCache
        uses: actions/cache@v4
        with:
          path: build/.ccache
          key: ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref_name }}-
            ccache-

      - name: Cache Toolchain (kerdevdep)
        uses: actions/cache@v4
        with:
          path: |
            kerdevdep/clang
            kerdevdep/anykernel
          key: kerdevdep-trb-clang-v1
          restore-keys: |
            kerdevdep-trb-clang-v1
            kerdevdep-trb-clang-

      - name: Build Pox Kernel & Flashable Zip
        id: build_kernel
        run: |
          bash kerdevdep/setup_kerdevdep.sh
          # A single branch can build any root flavor from a manual dispatch:
          # the chosen inputs are folded into GIT_BRANCH, which build.sh's
          # resolver turns into the edition name + defconfig, and the matching
          # patch set under variants/ is applied to the tree before building.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            REF="${{ github.event.inputs.root }}"
            [[ "${{ github.event.inputs.miui }}" == "true" ]] && REF="${REF}-miui"
            [[ "${{ github.event.inputs.c2 }}" == "true" ]] && REF="${REF}-c2"

            apply_patch() {
              if [[ -f "variants/$1.patch" ]]; then
                echo "::group::Applying variants/$1.patch"
                git apply --verbose --index "variants/$1.patch"
                echo "::endgroup::"
              fi
            }
            case "$REF" in
              *apatch*|*folkpatch*) apply_patch apatch ;;
              *ksu*)                apply_patch ksun ;;
              *bakasu*)             apply_patch bakasu ;;
            esac
            if [[ "$REF" == *miui* ]]; then apply_patch miui; fi
            if [[ "$REF" == *c2* ]]; then apply_patch c2; fi
          else
            REF="${{ github.ref_name }}"
          fi
          # Ensure any submodule (e.g. KernelSU, added by variants/ksun.patch) is
          # actually checked out; git apply only creates the gitlink.
          git submodule update --init --recursive
          export GITHUB_REF_NAME="$REF"
          export GIT_BRANCH="$REF"
          ./build.sh all

          # build.sh is the single source of truth for artifact identity.
          source build/build-info.env

          {
            echo "ZIP_PATH=$ZIP_PATH"
            echo "ZIP_NAME=$ZIP_NAME"
            echo "VERSION_NAME=$VERSION_NAME"
            echo "BRANCH_DESC=$BRANCH_DESC"
            echo "GIT_BRANCH=$GIT_BRANCH"
            echo "COMMIT_HASH=$COMMIT_HASH"
            echo "COMMIT_SUBJECT=$COMMIT_SUBJECT"
            echo "DEFCONFIG=$DEFCONFIG"
            echo "LINUX_VERSION=$LINUX_VERSION"
            echo "LOCALVERSION=$LOCALVERSION"
            echo "LOCALVERSION_EXTENDED=$LOCALVERSION_EXTENDED"
            echo "KERNEL_VERSION=$KERNEL_VERSION"
            echo "ZIP_SHA256=$ZIP_SHA256"
            echo "ZIP_SIZE_HUMAN=$ZIP_SIZE_HUMAN"
            echo "ZIP_SIZE_BYTES=$ZIP_SIZE_BYTES"
          } >> "$GITHUB_ENV"

      - name: Generate Release Notes
        run: |
          source build/build-info.env
          cat <<EOF > release_notes.md
          # Pox Kernel ${KERNEL_VERSION} [${VERSION_NAME}]

          > *"We aim for stability, not for anything else."*

          ### Release Information
          - **Edition**: ${VERSION_NAME} (${BRANCH_DESC})
          - **Branch**: \`${GIT_BRANCH}\`
          - **Commit**: \`${COMMIT_HASH}\` — ${COMMIT_SUBJECT}
          - **Defconfig**: \`${DEFCONFIG}\`
          - **Device**: ${DEVICE_NAME} (\`${DEVICE_CODENAME}\` / \`${DEVICE_CODENAME}_in\`)
          - **SoC**: MediaTek MT6785 / Helio G90T
          - **Linux Version**: ${LINUX_VERSION} LTS
          - **Kernel Release**: \`${LOCALVERSION}\` (extended: \`${LOCALVERSION_EXTENDED}\`)
          - **Toolchain**: ${TOOLCHAIN}

          ### Release Assets
          - **Flashable Recovery ZIP**: \`${ZIP_NAME}\` (Install via TWRP / OrangeFox)
          - **Kernel Binary**: \`Image.gz-dtb\`
          - **Size**: ${ZIP_SIZE_HUMAN}
          - **SHA256**: \`${ZIP_SHA256}\`

          ### Flashing Guide
          1. Reboot to Custom Recovery (TWRP, OrangeFox, PBRP).
          2. (Recommended) Perform a NANDroid backup of the \`Boot\` partition.
          3. Flash \`${ZIP_NAME}\`.
          4. Reboot system.

          ---
          ### Commit Log
          EOF
          git log -n 8 --pretty=format:"* %h - %s (%an)" >> release_notes.md
          echo "" >> release_notes.md

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            ${{ env.ZIP_PATH }}
            build/Image.gz-dtb
            build/build-info.env
            build/build-info.json
            build/gofile.env
            build/pixeldrain.env
            build/upload-info.env
          if-no-files-found: warn
          retention-days: 14

      - name: Mirror to Gofile
        continue-on-error: true
        env:
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
          GOFILE_FOLDER_ID: ${{ secrets.GOFILE_FOLDER_ID }}
        run: |
          ./build.sh gofile || true
          if [[ -f build/gofile.env ]]; then
            source build/gofile.env
            if [[ -n "${GOFILE_URL:-}" ]]; then
              {
                echo "### Gofile Mirror"
                echo ""
                echo "- **Download page**: ${GOFILE_URL}"
                echo "- **md5**: \`${GOFILE_MD5:-unknown}\`"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Mirror to PixelDrain
        continue-on-error: true
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          ./build.sh pixeldrain || true
          if [[ -f build/pixeldrain.env ]]; then
            source build/pixeldrain.env
            if [[ -n "${PIXELDRAIN_URL:-}" ]]; then
              {
                echo "### PixelDrain Mirror"
                echo ""
                echo "- **Download page**: ${PIXELDRAIN_URL}"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Notify Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN not configured - skipping Telegram notification"
            exit 0
          fi

          API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"

          [[ -f build/build-info.env ]] && source build/build-info.env
          [[ -f build/gofile.env ]] && source build/gofile.env
          [[ -f build/pixeldrain.env ]] && source build/pixeldrain.env

          ZIP_FILE="${ZIP_FILE:-${ZIP_PATH:-}}"
          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE="$(ls -t build/Pox-*.zip 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "::warning::No flashable zip found for Telegram upload"
            exit 0
          fi

          ZIP_BASE="${ZIP_NAME:-$(basename "$ZIP_FILE")}"
          SHA256="${ZIP_SHA256:-$(sha256sum "$ZIP_FILE" | awk '{print $1}')}"
          SIZE="${ZIP_SIZE_HUMAN:-$(du -h "$ZIP_FILE" | awk '{print $1}')}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG:-v1.0.0-Beta}"

          # Build the link block from the mirrors that actually succeeded.
          LINKS=""
          [[ -n "${GOFILE_URL:-}" ]] && LINKS="${LINKS}Gofile: ${GOFILE_URL}"$'\n'
          [[ -n "${PIXELDRAIN_URL:-}" ]] && LINKS="${LINKS}PixelDrain: ${PIXELDRAIN_URL}"$'\n'
          [[ -z "$LINKS" ]] && LINKS="Mirrors: unavailable (see GitHub release)"$'\n'

          MESSAGE="$(printf 'Pox Kernel %s [%s]\n%s\n\nBranch : %s\nCommit : %s\nKernel : %s\nFile   : %s (%s)\nSHA256 : %s\n%sGitHub : %s' \
            "${KERNEL_VERSION:-1.0.0-Beta}" "${VERSION_NAME:-Onyx}" "${BRANCH_DESC:-Custom Edition}" \
            "${GIT_BRANCH:-${GITHUB_REF_NAME}}" "${COMMIT_HASH:-unknown}" "${LOCALVERSION_EXTENDED:-unknown}" \
            "$ZIP_BASE" "$SIZE" "${SHA256:0:16}..." "$LINKS" "$RUN_URL")"

          CHAT_ID="${TELEGRAM_CHAT_ID:-}"
          if [ -z "$CHAT_ID" ]; then
            cat > /tmp/tg_chat.py <<'PY'
          import json, sys
          try:
              data = json.load(sys.stdin)
          except Exception:
              sys.exit(0)
          chats = {}
          for upd in data.get('result', []):
              msg = upd.get('message') or upd.get('edited_message') or upd.get('channel_post') or upd.get('my_chat_member') or {}
              chat = msg.get('chat') or {}
              cid, ctype = chat.get('id'), chat.get('type')
              if cid is not None:
                  chats[cid] = ctype
          groups = [cid for cid, ctype in chats.items() if ctype in ('group', 'supergroup')]
          if groups:
              print(groups[-1])
          elif chats:
              print(list(chats)[-1])
          PY
            CHAT_ID="$(curl -sS --max-time 30 "${API}/getUpdates?limit=100" | python3 /tmp/tg_chat.py || true)"
          fi
          if [ -z "$CHAT_ID" ]; then
            echo "::warning::No Telegram chat found (bot not in a group / no recent updates; pin one with the TELEGRAM_CHAT_ID secret) - skipping"
            exit 0
          fi

          # One message per build: upload the zip with the summary as its
          # caption. Telegram caps captions at 1024 chars (this summary is far
          # shorter) and zip documents at 50 MB, so an oversize zip or a
          # rejected upload falls back to a text-only message carrying the
          # same information instead of a second message.
          SENT=0
          if [ "$(stat -c%s "$ZIP_FILE")" -le 50000000 ]; then
            curl -sS --max-time 600 \
              -F "chat_id=${CHAT_ID}" \
              -F "document=@${ZIP_FILE}" \
              -F "caption=${MESSAGE}" \
              "${API}/sendDocument" > /tmp/tg_doc.json || true
            grep -q '"ok":true' /tmp/tg_doc.json 2>/dev/null && SENT=1
          else
            echo "::warning::Zip exceeds the Telegram 50 MB document limit - sending links only"
          fi

          if [ "$SENT" -ne 1 ]; then
            curl -sS --max-time 60 -X POST "${API}/sendMessage" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}" \
              --data-urlencode "disable_web_page_preview=true" > /tmp/tg_msg.json || true
            grep -q '"ok":true' /tmp/tg_msg.json 2>/dev/null || echo "::warning::Telegram sendMessage failed"
          fi

      - name: Upload to Mainline Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ vars.RELEASE_TAG || 'v1.0.0-Beta' }}
        run: |
          echo "[*] Target release: $RELEASE_TAG"
          set +e
          OUT=$(gh release upload "$RELEASE_TAG" "${{ env.ZIP_PATH }}" --clobber -R "${{ github.repository }}" 2>&1)
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "::warning::Release upload to '$RELEASE_TAG' failed: $OUT"
          else
            echo "[*] Uploaded $(basename "${{ env.ZIP_PATH }}") to release $RELEASE_TAG"
          fi

      - name: Publish Tagged Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --target "${{ github.sha }}" \
            --title "Pox Kernel ${{ github.ref_name }} [${{ env.VERSION_NAME }}]" \
            --notes-file release_notes.md \
            "${{ env.ZIP_PATH }}" \
            "build/Image.gz-dtb" || \
          gh release upload "${{ github.ref_name }}" \
            "${{ env.ZIP_PATH }}" \
            "build/Image.gz-dtb" --clobber
