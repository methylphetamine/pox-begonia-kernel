name: Pox Kernel Build & Release

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release Pox Kernel
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Host Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf libelf-dev libssl-dev lz4 \
            make zip python3 python-is-python3 libncurses6-dev libncurses6 pahole

      - name: Setup CCache
        uses: actions/cache@v4
        with:
          path: build/.ccache
          key: ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref_name }}-
            ccache-

      - name: Cache Toolchain (kerdevdep)
        uses: actions/cache@v4
        with:
          path: |
            kerdevdep/clang
            kerdevdep/anykernel
            kerdevdep/usr
            kerdevdep/lib
            kerdevdep/bin
            kerdevdep/env.sh
          key: kerdevdep-trb-clang-v1

      - name: Build Pox Kernel & Flashable Zip
        id: build_kernel
        run: |
          export GITHUB_REF_NAME="${{ github.ref_name }}"
          ./build.sh all

          COMMIT_SHORT=$(git rev-parse --short=7 HEAD)
          ZIP_PATH=$(ls build/Pox-*-${COMMIT_SHORT}-*.zip 2>/dev/null | head -n 1 || ls build/Pox-*.zip | grep -v 'latest.zip' | head -n 1)

          if [[ ! -f "$ZIP_PATH" ]]; then
            echo "::error::Flashable zip not found in build directory"
            exit 1
          fi

          BRANCH_NAME="${{ github.ref_name }}"
          case "$BRANCH_NAME" in
            main|granite)
              EDITION="Granite"
              EDITION_DESC="Rock-Solid Stability Edition"
              ;;
            obsidian)
              EDITION="Obsidian"
              EDITION_DESC="iOS-Style Compressed Memory Edition"
              ;;
            onyx|*)
              EDITION="Onyx"
              EDITION_DESC="Zero Frame-Drop Gaming Edition"
              ;;
          esac

          TAG_NAME="Pox-0.9-${EDITION}-${COMMIT_SHORT}"
          RELEASE_TITLE="Pox Kernel 0.9 [${EDITION}] (${COMMIT_SHORT})"

          echo "ZIP_PATH=$ZIP_PATH" >> $GITHUB_ENV
          echo "ZIP_NAME=$(basename "$ZIP_PATH")" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> $GITHUB_ENV
          echo "EDITION=$EDITION" >> $GITHUB_ENV
          echo "EDITION_DESC=$EDITION_DESC" >> $GITHUB_ENV
          echo "COMMIT_SHORT=$COMMIT_SHORT" >> $GITHUB_ENV

      - name: Generate Release Notes
        run: |
          cat <<EOF > release_notes.md
          # Pox Kernel 0.9 [${{ env.EDITION }} Edition]

          > *"We aim for stability, not for anything else."*

          ### Release Information
          - **Edition**: ${{ env.EDITION }} (${{ env.EDITION_DESC }})
          - **Version**: 0.9
          - **Branch**: \`${{ github.ref_name }}\`
          - **Commit**: \`${{ env.COMMIT_SHORT }}\`
          - **Device**: Xiaomi Redmi Note 8 Pro (\`begonia\` / \`begonia_in\`)
          - **SoC**: MediaTek MT6785 / Helio G90T
          - **Linux Version**: 4.14.357 LTS
          - **Toolchain**: TheRagingBeast TRB Clang 18.0.0 (17092023)
          - **APatch / KernelPatch**: Supported (\`CONFIG_KALLSYMS_ALL=y\`)

          ### Release Assets
          - **Flashable Recovery ZIP**: \`${{ env.ZIP_NAME }}\` (Install via TWRP / OrangeFox)
          - **Kernel Binary**: \`Image.gz-dtb\`

          ### Flashing Guide
          1. Reboot to Custom Recovery (TWRP, OrangeFox, PBRP).
          2. (Recommended) Perform a NANDroid backup of the \`Boot\` partition.
          3. Flash \`${{ env.ZIP_NAME }}\`.
          4. Reboot system.

          ---
          ### Commit Log
          EOF
          git log -n 8 --pretty=format:"* %h - %s (%an)" >> release_notes.md
          echo "" >> release_notes.md

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.TAG_NAME }}" \
            --title "${{ env.RELEASE_TITLE }}" \
            --notes-file release_notes.md \
            "${{ env.ZIP_PATH }}" \
            "build/Image.gz-dtb" || \
          gh release upload "${{ env.TAG_NAME }}" \
            "${{ env.ZIP_PATH }}" \
            "build/Image.gz-dtb" --clobber
      - name: Mirror to Gofile
        continue-on-error: true
        run: |
          ZIP_FILE="$ZIP_PATH"
          [[ -f "$ZIP_FILE" ]] || { echo "::warning::No zip to mirror"; exit 0; }
          LOCAL_MD5="$(md5sum "$ZIP_FILE" | awk '{print $1}')"
          SERVERS="$(curl -sS https://api.gofile.io/servers | python3 -c "import json,sys;print(' '.join(s['name'] for s in json.load(sys.stdin)['data']['servers']))" || true)"
          if [[ -z "$SERVERS" ]]; then
            echo "::warning::Gofile server list unavailable"
            exit 0
          fi
          RESP=""
          for SERVER in $SERVERS; do
            echo "Gofile server: $SERVER"
            RESP="$(curl -sS --max-time 900 -F "file=@${ZIP_FILE}" "https://${SERVER}.gofile.io/contents/uploadfile" || true)"
            grep -q '"downloadPage"' <<<"$RESP" && break
            RESP=""
          done
          if [[ -z "$RESP" ]]; then
            echo "::warning::Gofile mirror upload failed"
            exit 0
          fi
          PAGE="$(python3 -c "import json,sys;print(json.load(sys.stdin)['data']['downloadPage'])" <<<"$RESP")"
          REMOTE_MD5="$(python3 -c "import json,sys;print(json.load(sys.stdin)['data']['md5'])" <<<"$RESP")"
          echo "Gofile mirror page: $PAGE"
          echo "GOFILE_PAGE=$PAGE" >> $GITHUB_ENV
          echo "md5 local=$LOCAL_MD5 remote=$REMOTE_MD5"
          if [[ "$REMOTE_MD5" != "$LOCAL_MD5" ]]; then
            echo "::warning::Gofile md5 mismatch"
          fi
          {
            echo "### Gofile Mirror"
            echo ""
            echo "- **Download page**: $PAGE"
            echo "- **md5**: \`$LOCAL_MD5\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Notify Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN not configured - skipping Telegram notification"
            exit 0
          fi
          API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          ZIP_FILE="${ZIP_PATH:-}"
          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE="$(ls -t build/Pox-*.zip 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "::warning::No flashable zip found for Telegram upload"
            exit 0
          fi
          ZIP_BASE="${ZIP_NAME:-$(basename "$ZIP_FILE")}"
          SHA256="$(sha256sum "$ZIP_FILE" | awk '{print $1}')"
          SIZE="$(du -h "$ZIP_FILE" | awk '{print $1}')"
          GOFILE="${GOFILE_PAGE:-unavailable}"

          CHAT_ID="${TELEGRAM_CHAT_ID:-}"
          if [ -z "$CHAT_ID" ]; then
            cat > /tmp/tg_chat.py <<'PY'
          import json, sys
          try:
              data = json.load(sys.stdin)
          except Exception:
              sys.exit(0)
          chats = {}
          for upd in data.get('result', []):
              msg = upd.get('message') or upd.get('edited_message') or upd.get('channel_post') or upd.get('my_chat_member') or {}
              chat = msg.get('chat') or {}
              cid, ctype = chat.get('id'), chat.get('type')
              if cid is not None:
                  chats[cid] = ctype
          groups = [cid for cid, ctype in chats.items() if ctype in ('group', 'supergroup')]
          if groups:
              print(groups[-1])
          elif chats:
              print(list(chats)[-1])
          PY
            CHAT_ID="$(curl -sS --max-time 30 "${API}/getUpdates?limit=100" | python3 /tmp/tg_chat.py || true)"
          fi
          if [ -z "$CHAT_ID" ]; then
            echo "::warning::No Telegram chat found (bot not in a group / no recent updates; pin one with the TELEGRAM_CHAT_ID secret) - skipping"
            exit 0
          fi

          MESSAGE="$(printf 'Pox Kernel 1.0.0-Beta [%s]\nBranch: %s\nCommit: %s\nFile: %s (%s)\nSHA256: %s\nGofile: %s\nRun: %s/%s/actions/runs/%s\n' \
            "${EDITION:-unknown}" "${GITHUB_REF_NAME}" "${COMMIT_SHORT:-unknown}" "$ZIP_BASE" "$SIZE" "$SHA256" "$GOFILE" \
            "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}")"

          # One message per build: upload the zip with the summary as its
          # caption. Telegram caps captions at 1024 chars (this summary is far
          # shorter) and zip documents at 50 MB, so an oversize zip or a
          # rejected upload falls back to a text-only message carrying the
          # same information instead of a second message.
          SENT=0
          if [ "$(stat -c%s "$ZIP_FILE")" -le 50000000 ]; then
            curl -sS --max-time 600 \
              -F "chat_id=${CHAT_ID}" \
              -F "document=@${ZIP_FILE}" \
              -F "caption=${MESSAGE}" \
              "${API}/sendDocument" > /tmp/tg_doc.json || true
            grep -q '"ok":true' /tmp/tg_doc.json 2>/dev/null && SENT=1
          else
            echo "::warning::Zip exceeds the Telegram 50 MB document limit - sending links only"
          fi

          if [ "$SENT" -ne 1 ]; then
            curl -sS --max-time 60 -X POST "${API}/sendMessage" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}" \
              --data-urlencode "disable_web_page_preview=true" > /tmp/tg_msg.json || true
            grep -q '"ok":true' /tmp/tg_msg.json 2>/dev/null || echo "::warning::Telegram sendMessage failed"
          fi
