name: Pox Kernel Build & Release

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release Pox Kernel
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Host Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf libelf-dev libssl-dev lz4 \
            make zip python3 python-is-python3 libncurses6-dev libncurses6 pahole

      - name: Setup CCache
        uses: actions/cache@v4
        with:
          path: build/.ccache
          key: ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref_name }}-
            ccache-

      - name: Cache Toolchain (kerdevdep)
        uses: actions/cache@v4
        with:
          path: |
            kerdevdep/clang
            kerdevdep/anykernel
          key: kerdevdep-trb-clang-v1
          restore-keys: |
            kerdevdep-trb-clang-v1
            kerdevdep-trb-clang-

      - name: Build Pox Kernel & Flashable Zip
        id: build_kernel
        run: |
          bash kerdevdep/setup_kerdevdep.sh
          export GITHUB_REF_NAME="${{ github.ref_name }}"
          ./build.sh all

          # Resolve both root variant zips (real files only; the variant
          # symlinks like latest-APatch.zip are ignored via -type f).
          ZIP_PATH_APATCH="$(find build -maxdepth 1 -type f -name '*-APatch.zip' -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -n1 | cut -d' ' -f2- || true)"
          ZIP_PATH_FOLKPATCH="$(find build -maxdepth 1 -type f -name '*-FolkPatch.zip' -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -n1 | cut -d' ' -f2- || true)"

          if [[ -z "$ZIP_PATH_APATCH" || ! -f "$ZIP_PATH_APATCH" ]]; then
            echo "::error::APatch flashable zip not found in build directory"
            exit 1
          fi
          if [[ -z "$ZIP_PATH_FOLKPATCH" || ! -f "$ZIP_PATH_FOLKPATCH" ]]; then
            echo "::error::FolkPatch flashable zip not found in build directory"
            exit 1
          fi

          # Primary artifact stays the FolkPatch zip for compatibility.
          ZIP_PATH="$ZIP_PATH_FOLKPATCH"

          BRANCH_NAME="${{ github.ref_name }}"
          case "$BRANCH_NAME" in
            onyx-sultan-apatch*|*sultan-apatch*|*sultan*)
              EDITION="Onyx-Sultan-APatch"
              EDITION_DESC="Zero Frame-Drop & Sultan Debloat APatch Edition"
              ROOT_INFO="APatch / KernelPatch Supported + Sultan Debloat"
              ;;
            onyx-resukisu*|*resukisu*)
              EDITION="Onyx-ReSukiSu"
              EDITION_DESC="Zero Frame-Drop Gaming & ReSukiSu Ultra Edition"
              ROOT_INFO="ReSukiSu v4.2.0 (40901) + SuSFS v2.3.0 + NoMount 2.0.0 (Multi-Manager, App Profile, SELinux Hide)"
              ;;
            onyx-apatch*|*apatch*)
              EDITION="Onyx-APatch"
              EDITION_DESC="Zero Frame-Drop Gaming & APatch Edition"
              ROOT_INFO="APatch / KernelPatch Supported (CONFIG_KALLSYMS_ALL=y, CONFIG_KPROBES=y, OverlayFS redirect & index)"
              ;;
            onyx-ksu-next*|*ksu-next*)
              EDITION="Onyx-KSU-Next"
              EDITION_DESC="Zero Frame-Drop Gaming & KernelSU-Next Edition"
              ROOT_INFO="KernelSU-Next v3.3.0 + NoMount VFS"
              ;;
            onyx-kaeru*|*kaeru*)
              EDITION="Onyx-Kaeru"
              EDITION_DESC="Zero Frame-Drop Gaming & Kaeru Bootloader Edition"
              ROOT_INFO="Kaeru Bootloader & Merged DTB Ready (Unrooted / APatch)"
              ;;
            main|granite)
              EDITION="Granite"
              EDITION_DESC="Rock-Solid Stability Edition"
              ROOT_INFO="Standard Edition (KernelPatch / APatch Ready)"
              ;;
            obsidian)
              EDITION="Obsidian"
              EDITION_DESC="iOS-Style Compressed Memory Edition"
              ROOT_INFO="Standard Edition (KernelPatch / APatch Ready)"
              ;;
            onyx|*)
              EDITION="Onyx"
              EDITION_DESC="Zero Frame-Drop Gaming Edition (Unrooted)"
              ROOT_INFO="None (Strictly Unrooted - Pure Stock Play Integrity)"
              ;;
          esac

          COMMIT_SHORT="$(git rev-parse --short=7 HEAD 2>/dev/null || echo "${{ github.sha }}" | cut -c1-7)"
          TAG_NAME="Pox-1.0.0-Beta-${EDITION}-${COMMIT_SHORT}"
          RELEASE_TITLE="Pox Kernel 1.0.0-Beta [${EDITION}] (${COMMIT_SHORT})"

          echo "ZIP_PATH=$ZIP_PATH" >> $GITHUB_ENV
          echo "ZIP_NAME=$(basename "$ZIP_PATH")" >> $GITHUB_ENV
          echo "ZIP_PATH_APATCH=$ZIP_PATH_APATCH" >> $GITHUB_ENV
          echo "ZIP_NAME_APATCH=$(basename "$ZIP_PATH_APATCH")" >> $GITHUB_ENV
          echo "ZIP_PATH_FOLKPATCH=$ZIP_PATH_FOLKPATCH" >> $GITHUB_ENV
          echo "ZIP_NAME_FOLKPATCH=$(basename "$ZIP_PATH_FOLKPATCH")" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> $GITHUB_ENV
          echo "EDITION=$EDITION" >> $GITHUB_ENV
          echo "EDITION_DESC=$EDITION_DESC" >> $GITHUB_ENV
          echo "ROOT_INFO=$ROOT_INFO" >> $GITHUB_ENV
          echo "COMMIT_SHORT=$COMMIT_SHORT" >> $GITHUB_ENV

      - name: Generate Release Notes
        run: |
          cat <<EOF > release_notes.md
          # Pox Kernel 1.0.0-Beta [${{ env.EDITION }} Edition]

          > *"We aim for stability, not for anything else."*

          ### Release Information
          - **Edition**: ${{ env.EDITION }} (${{ env.EDITION_DESC }})
          - **Root Support**: ${{ env.ROOT_INFO }}
          - **Version**: 1.0.0-Beta
          - **Branch**: \`${{ github.ref_name }}\`
          - **Commit**: \`${{ env.COMMIT_SHORT }}\`
          - **Device**: Xiaomi Redmi Note 8 Pro (\`begonia\` / \`begonia_in\`)
          - **SoC**: MediaTek MT6785 / Helio G90T
          - **Linux Version**: 4.14.357 LTS
          - **Toolchain**: TheRagingBeast TRB Clang 18.0.0 (17092023)

          ### Release Assets
          - **Flashable Recovery ZIP (FolkPatch)**: \`${{ env.ZIP_NAME_FOLKPATCH }}\` (Install via TWRP / OrangeFox)
          - **Flashable Recovery ZIP (APatch)**: \`${{ env.ZIP_NAME_APATCH }}\` (Install via TWRP / OrangeFox)
          - **Kernel Binary**: \`Image.gz-dtb\`

          ### Bundled Root (Auto-Flash)
          Both ZIPs carry the same kernel; each one bundles a single root
          solution, flashes it right after the kernel, and stages its manager
          app for automatic install on first boot:
          - \`${{ env.ZIP_NAME_FOLKPATCH }}\` bundles FolkPatch (KernelPatch, LyraVoid/FolkPatch)
          - \`${{ env.ZIP_NAME_APATCH }}\` bundles APatch (KernelPatch, bmax121/APatch)

          ### Flashing Guide
          1. Reboot to Custom Recovery (TWRP, OrangeFox, PBRP).
          2. (Recommended) Perform a NANDroid backup of the \`Boot\` partition.
          3. Flash ONE of the two ZIPs above (kernel + bundled root auto-flash).
          4. Reboot system.

          ---
          ### Commit Log
          EOF
          git log -n 8 --pretty=format:"* %h - %s (%an)" >> release_notes.md
          echo "" >> release_notes.md

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pox-Kernel-${{ env.EDITION }}-${{ env.COMMIT_SHORT }}
          path: |
            ${{ env.ZIP_PATH_APATCH }}
            ${{ env.ZIP_PATH_FOLKPATCH }}
            build/Image.gz-dtb
          retention-days: 14

      - name: Mirror to Gofile
        continue-on-error: true
        run: |
          # Mirror each variant zip separately (guest uploads cannot share a
          # folder); report one download page per variant.
          for VARIANT in APatch FolkPatch; do
            case "$VARIANT" in
              APatch) ZIP_FILE="${ZIP_PATH_APATCH:-}";;
              FolkPatch) ZIP_FILE="${ZIP_PATH_FOLKPATCH:-${ZIP_PATH:-}}";;
            esac
            if [[ -z "$ZIP_FILE" || ! -f "$ZIP_FILE" ]]; then
              echo "::warning::No $VARIANT zip to mirror"
              continue
            fi
            echo "[*] Mirroring $(basename "$ZIP_FILE") ($VARIANT)"
            LOCAL_MD5="$(md5sum "$ZIP_FILE" | awk '{print $1}')"
            SERVERS="$(curl -sS https://api.gofile.io/servers | python3 -c "import json,sys;print(' '.join(s['name'] for s in json.load(sys.stdin)['data']['servers']))" || true)"
            if [[ -z "$SERVERS" ]]; then
              echo "::warning::Gofile server list unavailable"
              continue
            fi
            RESP=""
            for SERVER in $SERVERS; do
              echo "Gofile server: $SERVER"
              RESP="$(curl -sS --max-time 900 -F "file=@${ZIP_FILE}" "https://${SERVER}.gofile.io/contents/uploadfile" || true)"
              grep -q '"downloadPage"' <<<"$RESP" && break
              RESP=""
            done
            if [[ -z "$RESP" ]]; then
              echo "::warning::Gofile mirror upload failed ($VARIANT)"
              continue
            fi
            PAGE="$(python3 -c "import json,sys;print(json.load(sys.stdin)['data']['downloadPage'])" <<<"$RESP")"
            REMOTE_MD5="$(python3 -c "import json,sys;print(json.load(sys.stdin)['data']['md5'])" <<<"$RESP")"
            echo "Gofile mirror page ($VARIANT): $PAGE"
            echo "GOFILE_PAGE_${VARIANT^^}=$PAGE" >> $GITHUB_ENV
            if [[ "$VARIANT" == "FolkPatch" ]]; then
              echo "GOFILE_PAGE=$PAGE" >> $GITHUB_ENV
            fi
            echo "md5 local=$LOCAL_MD5 remote=$REMOTE_MD5"
            if [[ "$REMOTE_MD5" != "$LOCAL_MD5" ]]; then
              echo "::warning::Gofile md5 mismatch ($VARIANT)"
            fi
            {
              echo "### Gofile Mirror ($VARIANT)"
              echo ""
              echo "- **Download page**: $PAGE"
              echo "- **md5**: \`$LOCAL_MD5\`"
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Notify Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN not configured - skipping Telegram notification"
            exit 0
          fi
          API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          ZIP_FILE_APATCH="${ZIP_PATH_APATCH:-}"
          ZIP_FILE_FOLKPATCH="${ZIP_PATH_FOLKPATCH:-${ZIP_PATH:-}}"
          if [ -z "$ZIP_FILE_APATCH" ] || [ ! -f "$ZIP_FILE_APATCH" ]; then
            ZIP_FILE_APATCH="$(find build -maxdepth 1 -type f -name '*-APatch.zip' | head -n 1 || true)"
          fi
          if [ -z "$ZIP_FILE_FOLKPATCH" ] || [ ! -f "$ZIP_FILE_FOLKPATCH" ]; then
            ZIP_FILE_FOLKPATCH="$(find build -maxdepth 1 -type f -name '*-FolkPatch.zip' | head -n 1 || true)"
          fi
          if [ -z "$ZIP_FILE_APATCH" ] && [ -z "$ZIP_FILE_FOLKPATCH" ]; then
            echo "::warning::No flashable zips found for Telegram upload"
            exit 0
          fi
          SHA256_APATCH="$( [ -n "$ZIP_FILE_APATCH" ] && sha256sum "$ZIP_FILE_APATCH" | awk '{print $1}' || echo unavailable )"
          SHA256_FOLKPATCH="$( [ -n "$ZIP_FILE_FOLKPATCH" ] && sha256sum "$ZIP_FILE_FOLKPATCH" | awk '{print $1}' || echo unavailable )"
          SIZE_APATCH="$( [ -n "$ZIP_FILE_APATCH" ] && du -h "$ZIP_FILE_APATCH" | awk '{print $1}' || echo unavailable )"
          SIZE_FOLKPATCH="$( [ -n "$ZIP_FILE_FOLKPATCH" ] && du -h "$ZIP_FILE_FOLKPATCH" | awk '{print $1}' || echo unavailable )"
          GOFILE_APATCH="${GOFILE_PAGE_APATCH:-unavailable}"
          GOFILE_FOLKPATCH="${GOFILE_PAGE_FOLKPATCH:-unavailable}"

          CHAT_ID="${TELEGRAM_CHAT_ID:-}"
          if [ -z "$CHAT_ID" ]; then
            cat > /tmp/tg_chat.py <<'PY'
          import json, sys
          try:
              data = json.load(sys.stdin)
          except Exception:
              sys.exit(0)
          chats = {}
          for upd in data.get('result', []):
              msg = upd.get('message') or upd.get('edited_message') or upd.get('channel_post') or upd.get('my_chat_member') or {}
              chat = msg.get('chat') or {}
              cid, ctype = chat.get('id'), chat.get('type')
              if cid is not None:
                  chats[cid] = ctype
          groups = [cid for cid, ctype in chats.items() if ctype in ('group', 'supergroup')]
          if groups:
              print(groups[-1])
          elif chats:
              print(list(chats)[-1])
          PY
            CHAT_ID="$(curl -sS --max-time 30 "${API}/getUpdates?limit=100" | python3 /tmp/tg_chat.py || true)"
          fi
          if [ -z "$CHAT_ID" ]; then
            echo "::warning::No Telegram chat found (bot not in a group / no recent updates; pin one with the TELEGRAM_CHAT_ID secret) - skipping"
            exit 0
          fi

          MESSAGE="$(printf 'Pox Kernel 1.0.0-Beta [%s]\nBranch: %s\nCommit: %s\n\nFolkPatch zip: %s (%s)\nSHA256: %s\n\nAPatch zip: %s (%s)\nSHA256: %s\n\nGofile FolkPatch: %s\nGofile APatch: %s\nRun: %s/%s/actions/runs/%s\n' \
            "${EDITION:-unknown}" "${GITHUB_REF_NAME}" "${COMMIT_SHORT:-unknown}" \
            "$( [ -n "$ZIP_FILE_FOLKPATCH" ] && basename "$ZIP_FILE_FOLKPATCH" || echo none )" "$SIZE_FOLKPATCH" "$SHA256_FOLKPATCH" \
            "$( [ -n "$ZIP_FILE_APATCH" ] && basename "$ZIP_FILE_APATCH" || echo none )" "$SIZE_APATCH" "$SHA256_APATCH" \
            "$GOFILE_FOLKPATCH" "$GOFILE_APATCH" \
            "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}")"

          # One message per build: both zips ride in a single media group
          # (album) under the summary caption. Telegram caps captions at 1024
          # chars and albums around 45 MB of total media, so oversize sets
          # fall back to the FolkPatch zip alone, then to one text message.
          SENT=0
          TOTAL_BYTES=0
          for zf in "$ZIP_FILE_APATCH" "$ZIP_FILE_FOLKPATCH"; do
            [ -n "$zf" ] && TOTAL_BYTES=$((TOTAL_BYTES + $(stat -c%s "$zf")))
          done

          if [ -n "$ZIP_FILE_APATCH" ] && [ -n "$ZIP_FILE_FOLKPATCH" ] \
             && [ "$TOTAL_BYTES" -le 45000000 ] \
             && [ "$(stat -c%s "$ZIP_FILE_APATCH")" -le 50000000 ] \
             && [ "$(stat -c%s "$ZIP_FILE_FOLKPATCH")" -le 50000000 ]; then
            python3 - "$MESSAGE" > /tmp/tg_media.json <<'PY'
          import json, sys
          media = [
              {"type": "document", "media": "attach://doc_folkpatch", "caption": sys.argv[1]},
              {"type": "document", "media": "attach://doc_apatch"},
          ]
          print(json.dumps(media))
          PY
            curl -sS --max-time 900 \
              -F "chat_id=${CHAT_ID}" \
              -F "media=</tmp/tg_media.json" \
              -F "doc_folkpatch=@${ZIP_FILE_FOLKPATCH}" \
              -F "doc_apatch=@${ZIP_FILE_APATCH}" \
              "${API}/sendMediaGroup" > /tmp/tg_album.json || true
            if grep -q '"ok":true' /tmp/tg_album.json 2>/dev/null; then
              SENT=1
              echo "[*] Telegram media group sent as a single message"
            else
              echo "::warning::Telegram album upload failed - falling back to a single upload"
            fi
          else
            echo "::warning::Zips exceed Telegram album limits - falling back to a single upload"
          fi

          if [ "$SENT" -ne 1 ]; then
            FALLBACK_FILE="$ZIP_FILE_FOLKPATCH"
            [ -n "$FALLBACK_FILE" ] || FALLBACK_FILE="$ZIP_FILE_APATCH"
            if [ -n "$FALLBACK_FILE" ] && [ "$(stat -c%s "$FALLBACK_FILE")" -le 50000000 ]; then
              curl -sS --max-time 600 \
                -F "chat_id=${CHAT_ID}" \
                -F "document=@${FALLBACK_FILE}" \
                -F "caption=${MESSAGE}" \
                "${API}/sendDocument" > /tmp/tg_doc.json || true
              grep -q '"ok":true' /tmp/tg_doc.json 2>/dev/null && SENT=1
            fi
          fi

          if [ "$SENT" -ne 1 ]; then
            curl -sS --max-time 60 -X POST "${API}/sendMessage" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}" \
              --data-urlencode "disable_web_page_preview=true" > /tmp/tg_msg.json || true
            grep -q '"ok":true' /tmp/tg_msg.json 2>/dev/null || echo "::warning::Telegram sendMessage failed"
          fi
      - name: Upload to Mainline Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ vars.RELEASE_TAG || 'v1.0.0-Beta' }}
        run: |
          echo "[*] Target release: $RELEASE_TAG"
          set +e
          OUT=$(gh release upload "$RELEASE_TAG" "${{ env.ZIP_PATH_APATCH }}" "${{ env.ZIP_PATH_FOLKPATCH }}" --clobber -R "${{ github.repository }}" 2>&1)
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "::warning::Release upload to '$RELEASE_TAG' failed: $OUT"
          else
            echo "[*] Uploaded $(basename "${{ env.ZIP_PATH_APATCH }}") + $(basename "${{ env.ZIP_PATH_FOLKPATCH }}") to release $RELEASE_TAG"
          fi

      - name: Publish Tagged Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --target "${{ github.sha }}" \
            --title "Pox Kernel ${{ github.ref_name }} [${{ env.EDITION }}]" \
            --notes-file release_notes.md \
            "${{ env.ZIP_PATH_APATCH }}" \
            "${{ env.ZIP_PATH_FOLKPATCH }}" \
            "build/Image.gz-dtb" || \
          gh release upload "${{ github.ref_name }}" \
            "${{ env.ZIP_PATH_APATCH }}" \
            "${{ env.ZIP_PATH_FOLKPATCH }}" \
            "build/Image.gz-dtb" --clobber


